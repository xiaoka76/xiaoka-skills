[project]
name = "seedream"
version = "3.0.5"
description = "Seedream 5.0 Pro 图像生成 CLI - 文生图/图生图/图层拆分/透明背景/标记预览，自动保存可复用的生成记录"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.28",
    "annotated-doc>=0.0.4",
    "pillow>=10.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
seedream = "seedream.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
